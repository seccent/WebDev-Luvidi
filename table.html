<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            padding: 16px;
        }
        table{
            width: 400px;
            border-collapse: separate;
            border-spacing: 8px;
        }
        th,td{
            padding: 12px;
        }
        th{
            background-color: blanchedalmond;
            border: 1px solid lightgray;
        }
        td{
            border-radius: 8px;
            background-color:rgb(252, 255, 223);
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>
        Top 5 Movie 2026
    </h1>
    <table>
        <tr>
            <th>No</th>
            <th>Name</th>
            <th>Release</th>
        </tr>
        <tr>
            <td>1</td>
            <td>The Odyssey</td>
            <td>15 July</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Spider-Man: Brand New Day</td>
            <td>5 August</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Project Hail Mary</td>
            <td>20 March</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Toy Story 5</td>
            <td>17 June</td>
        </tr>
        <tr>
            <td>5</td>
            <td>The Super Mario Galaxy Movie</td>
            <td>1 April</td>
        </tr>
    </table>
</body>
</html>
